<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Check - BharatMinds AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #2d3748;
            margin-bottom: 30px;
            font-size: 32px;
        }

        #results {
            color: #2d3748;
        }

        h2 {
            color: #2d3748;
            margin: 20px 0;
        }

        h3 {
            color: #4a5568;
            margin: 20px 0 10px 0;
        }

        p {
            margin: 10px 0;
            line-height: 1.6;
        }

        pre {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔍 Database Status Check</h1>
        <div id="results">
            <p>Loading...</p>
        </div>
    </div>

    <script src="check-db.js"></script>
</body>

</html>
