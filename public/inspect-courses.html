<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Course Data Inspector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #2d3748;
            margin-bottom: 30px;
        }

        h2 {
            color: #4a5568;
            margin: 30px 0 15px 0;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        h3 {
            margin: 15px 0;
        }

        p {
            margin: 10px 0;
            line-height: 1.6;
        }

        strong {
            color: #2d3748;
        }

        pre {
            background: #f7fafc;
            padding: 20px;
            overflow: auto;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            font-size: 13px;
            max-height: 400px;
        }

        input {
            border: 2px solid#e2e8f0;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔍 Course Data Structure Inspector</h1>
        <div id="info">Loading...</div>
    </div>

    <script src="inspect-courses.js"></script>
</body>

</html>
